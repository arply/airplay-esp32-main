[platformio]
default_envs = arply_v1
src_dir = main
extra_configs = user_platformio.ini

; Common settings for all environments
[env]
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = spiffs
build_flags =
    -Wno-maybe-uninitialized
    -Os
    -DCONFIG_SPIRAM_SIZE=8388608

; ARPLY v1 — Seeed XIAO ESP32-S3 + PCM5102A.
; 8MB flash, 8MB octal PSRAM. The XIAO has no USB-UART bridge, so console and
; monitor run over the built-in USB Serial/JTAG on the USB-C port — see
; CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG in sdkconfig.defaults.arply_v1.
[env:arply_v1]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.arply_v1"
monitor_rts = 0
monitor_dtr = 0

; ARPLY v1 with USB-DAC input enabled — same hardware, but arply also
; enumerates as a USB Audio Class speaker (see main/audio/usb_dac_input.c).
; The console moves from USB Serial/JTAG to a CDC-ACM port on the same
; composite USB device — see sdkconfig.defaults.usb_dac and
; CONFIG_AUDIO_INPUT_USB_DAC's help text in main/Kconfig.projbuild.
; Flashing still uses the normal BOOT+RESET download-mode sequence.
[env:arply_v1_usbdac]
extends = env:arply_v1
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.arply_v1;sdkconfig.defaults.usb_dac"
