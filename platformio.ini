[platformio]
default_envs = arply_v1
src_dir = main
extra_configs = user_platformio.ini

; Common settings for all environments
[env]
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = spiffs
build_flags =
    -Wno-maybe-uninitialized
    -Os
    -DCONFIG_SPIRAM_SIZE=8388608

; ARPLY v1 — Seeed XIAO ESP32-S3 + PCM5102A.
; 8MB flash, 8MB octal PSRAM. The XIAO has no USB-UART bridge, so console and
; monitor run over the built-in USB Serial/JTAG on the USB-C port — see
; CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG in sdkconfig.defaults.arply_v1.
[env:arply_v1]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_upload.flash_size = 8MB
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.arply_v1"
monitor_rts = 0
monitor_dtr = 0
